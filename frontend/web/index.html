<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!--
    Declared here on purpose. With no viewport meta of its own, the Flutter
    web engine injects one carrying maximum-scale=1.0 and user-scalable=no,
    which blocks pinch-zoom and fails WCAG 1.4.4. Low-vision users need to be
    able to zoom a shop.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Campus shopping and delivery. Order from stores around you and have it brought to your block in minutes.">
  <meta name="theme-color" content="#143E32">
  <style>
    :root {
      --text: #17221D;
      --muted: #66716A;
      --strong: #1D4939;
      --track: #E1E5DD;
      --canvas: #F7F6F0;
      --surface: #FFFDF8;
      --forest: #143E32;
      --lime: #C6EE63;
    }
    html, body { background: var(--canvas); }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Unimiunte">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- The two origins the first screen needs before it can show anything: the
       API it asks for the catalogue, and the CDN every product photograph
       comes from. Opening those connections while flutter_bootstrap.js is
       still parsing saves a DNS lookup and a TLS handshake each — a few
       hundred milliseconds on a phone, before the first byte of the first
       image. Harmless if a build points somewhere else; an unused preconnect
       is closed after ten seconds. -->
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
  <link rel="preconnect" href="https://api.geltrax.engineer" crossorigin>
  <link rel="dns-prefetch" href="https://res.cloudinary.com">
  <link rel="dns-prefetch" href="https://api.geltrax.engineer">

  <title>Unimiunte</title>
  <link rel="manifest" href="manifest.json">
  <!-- Render at no more than 2x, whatever the screen reports.
       CanvasKit rasterises the whole scene itself every frame; there is no
       browser compositor doing the cheap thing. At the devicePixelRatio of 3
       that phones report, a 390x844 screen is 1170x2532 real pixels redrawn
       per frame — 2.25x the work of 2x for a difference nobody can see on a
       product photograph. Set before flutter_bootstrap.js, because the engine
       reads this once on start-up. -->
  <script>
    (function () {
      var real = window.devicePixelRatio || 1;
      if (real > 2) {
        Object.defineProperty(window, 'devicePixelRatio', {
          get: function () { return 2; },
          configurable: true,
        });
      }
    })();
  </script>

  <script src="firebase-env.js"></script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
    import {
      getMessaging,
      getToken,
      isSupported,
      onMessage,
    } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging.js';

    // One source of truth: web/firebase-env.js, loaded above and checked in
    // because a Firebase *web* config is not a secret — it ships inside the JS
    // bundle whatever you do, and the project it names (`messages-34023`) is
    // the same one the API's service account sends from. The client and the
    // server have to agree on it or a token registers against a project that
    // will never push to it.
    //
    // What used to be here was a second copy of those same values, behind a
    // FIXME asking ops to delete it. Two copies of a config that must match
    // the server is how they stop matching. If the file is missing, push is
    // off for this build and says so — that is a deploy to fix, not something
    // to paper over with a default.
    const firebaseConfig = window.lamazonFirebaseConfig;
    const app = firebaseConfig ? initializeApp(firebaseConfig) : null;
    let messagingPromise;
    let foregroundHandlerReady = false;

    if (!app) {
      console.warn(
        'Unimiunte: firebase-env.js did not load, so push is off for this ' +
        'build. Deploy it alongside index.html.',
      );
    }

    window.lamazonFirebaseMessagingToken = async (vapidKey) => {
      if (!app) return '';
      if (!(await isSupported())) return '';
      if (Notification.permission !== 'granted') return '';
      if (!vapidKey) {
        throw new Error('FIREBASE_WEB_PUSH_PUBLIC_KEY is not configured');
      }

      messagingPromise ??= Promise.resolve(getMessaging(app));
      const messaging = await messagingPromise;
      const registration = await navigator.serviceWorker.register('/push/sw.js', {
        scope: '/push/',
      });
      await waitForActiveServiceWorker(registration);
      const options = { serviceWorkerRegistration: registration };
      options.vapidKey = vapidKey;

      if (!foregroundHandlerReady) {
        foregroundHandlerReady = true;
        onMessage(messaging, (payload) => {
          console.info('[Unimiunte push] foreground FCM payload', payload);
          const data = payload?.data || {};
          const notification = payload?.notification || {};
          const title = data.title || notification.title || 'Unimiunte';
          const body = data.body || notification.body || '';
          const confirm = data.confirm === 'true' || data.confirm === true;
          if (title || body) {
            registration.showNotification(title, {
              body,
              icon: '/icons/Icon-192.png',
              badge: '/icons/Icon-192.png',
              tag: data.tag || 'lamazon',
              data: { url: data.url || '/', confirm },
              actions: confirm
                ? [{ action: 'confirm', title: 'Yes, got it' }]
                : [],
              requireInteraction: confirm,
            }).catch((error) => {
              console.error('[Unimiunte push] showNotification failed', error);
              if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(title, { body, icon: '/icons/Icon-192.png' });
              }
            });
          }
        });
      }

      return getToken(messaging, options);
    };

    async function waitForActiveServiceWorker(registration) {
      if (registration.active) return;
      const worker = registration.installing || registration.waiting;
      if (!worker) {
        await navigator.serviceWorker.ready;
        return;
      }
      await new Promise((resolve, reject) => {
        const timeout = setTimeout(
          () => reject(new Error('Firebase service worker did not activate')),
          10000,
        );
        worker.addEventListener('statechange', () => {
          if (worker.state === 'activated') {
            clearTimeout(timeout);
            resolve();
          }
        });
      });
    }
  </script>
</head>
<body>
  <!-- What a person looks at while Flutter boots.
       The engine and the app are about 2.7 MB of WebAssembly that has to be
       downloaded and compiled before a single pixel of the app exists — around
       eight seconds on a mid-range phone, during which this document was
       previously blank. A blank page does not read as "loading", it reads as
       broken, and that is the whole of what "it lags when I launch it" was.
       This paints as soon as the HTML lands, in the app's own colours, so the
       wait looks like a shop opening rather than a page failing. No images and
       no fonts: an extra request here would be waiting on the very thing we
       are covering for. -->
  <style>
    #boot {
      position: fixed; inset: 0; z-index: 2147483647;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; background: #F7F6F0; color: #17221D;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .35s ease;
    }
    #boot[hidden] { display: none; }
    #boot .mark {
      font-size: 30px; font-weight: 650; letter-spacing: -.8px; color: #143E32;
    }
    #boot .mark span { color: #6F9A34; }
    #boot .line { font-size: 13.5px; letter-spacing: .2px; color: #6B7280; }
    #boot .bar {
      width: 168px; height: 4px; border-radius: 999px;
      background: #E1E5DD; overflow: hidden;
    }
    #boot .bar i {
      display: block; width: 45%; height: 100%; border-radius: 999px;
      background: #143E32; animation: boot-slide 1.15s ease-in-out infinite;
    }
    @keyframes boot-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(322%); }
    }
    /* Somebody who asked for less movement gets a bar that simply sits there. */
    @media (prefers-reduced-motion: reduce) {
      #boot .bar i { animation: none; width: 100%; opacity: .55; }
    }
  </style>
  <div id="boot" role="status" aria-live="polite" aria-label="Loading Unimiunte">
    <div class="mark">Unimiunte<span>.</span></div>
    <div class="bar"><i></i></div>
    <div class="line">Local choice. Global experience.</div>
  </div>
  <script>
    // Flutter fires this the moment it has painted its first frame, which is
    // exactly when this stops being useful and starts being in the way.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.style.opacity = '0';
      setTimeout(function () { boot.hidden = true; }, 400);
    });
  </script>
  <script>
    window.downloadLamazonCSV = (name, contents) => {
      const url = URL.createObjectURL(new Blob(['\ufeff', contents], {type: 'text/csv;charset=utf-8'}));
      const link = document.createElement('a'); link.href = url; link.download = name;
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
